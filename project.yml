name: TimeGlass
options:
  bundleIdPrefix: com.gabrielhoellrigl
  deploymentTarget:
    macOS: "26.0"
targets:
  TimeGlass:
    type: application
    platform: macOS
    sources:
      - path: Sources/TimeGlass
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrielhoellrigl.timeglass
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: TimeGlass
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
  TimeGlassTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/TimeGlassTests
    dependencies:
      - target: TimeGlass
    settings:
      base:
        SWIFT_VERSION: "5.0"
schemes:
  TimeGlass:
    build:
      targets:
        TimeGlass: all
        TimeGlassTests: [test]
    test:
      targets:
        - TimeGlassTests
    run:
      config: Debug
